<div class="dashboard">

  <div class="favorite-section">
    <app-favorite-candidate-carousel [candidates]="favorites()">
    </app-favorite-candidate-carousel>
  </div>

  <div class="chart-section">
    <app-candidate-position-chart [candidates]="favorites()">
    </app-candidate-position-chart>

    <app-candidate-level-chart [candidates]="favorites()">
    </app-candidate-level-chart>
  </div>

  <div class="card-section">
    <app-kpi-card title="Total"
                  [value]="total()">
    </app-kpi-card>

    <app-kpi-card title="Frontend"
                  [value]="frontend()">
    </app-kpi-card>

    <app-kpi-card title="Backend"
                  [value]="backend()">
    </app-kpi-card>

    <app-kpi-card title="FullStack"
                  [value]="fullstack()">
    </app-kpi-card>
  </div>
</div>
