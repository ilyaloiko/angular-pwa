<div class="dashboard">

  <div class="favorite-section">
    <app-favorite-carousel [candidates]="favoriteCandidates()">
    </app-favorite-carousel>
  </div>

  <div class="chart-section">
    <app-position-chart [candidates]="candidates()">
    </app-position-chart>

    <app-level-chart [candidates]="candidates()">
    </app-level-chart>
  </div>

  <div class="kpi-section">
    <app-kpi-card title="Total"
                  [value]="total()">
    </app-kpi-card>

    <app-kpi-card title="Frontend"
                  [value]="frontend()">
    </app-kpi-card>

    <app-kpi-card title="Backend"
                  [value]="backend()">
    </app-kpi-card>

    <app-kpi-card title="FullStack"
                  [value]="fullstack()">
    </app-kpi-card>
  </div>
</div>
